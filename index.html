<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="#E4E7E1" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#111511" media="(prefers-color-scheme: dark)" />
	<script>
		(function () {
			try {
				var saved = localStorage.getItem('color-scheme')
				var scheme = saved === 'light' || saved === 'dark'
					? saved
					: (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
				document.documentElement.setAttribute('data-theme', scheme)
				var themeColor = scheme === 'dark' ? '#111511' : '#E4E7E1'
				Array.prototype.forEach.call(
					document.querySelectorAll('meta[name="theme-color"]'),
					function (meta) { meta.setAttribute('content', themeColor) }
				)
			} catch (error) { }
		})()
	</script>
