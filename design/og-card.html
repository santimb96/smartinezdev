<!DOCTYPE html>
<!--
  Source for public/img/og-card.png (1200x630 social card).
  Regenerate from the repository root with:
  chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
    --window-size=1200,630 --allow-file-access-from-files \
    --screenshot=public/img/og-card.png design/og-card.html
-->
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<style>
		@font-face {
			font-family: 'Archivo';
			src: url('../public/fonts/Archivo.woff2') format('woff2');
			font-weight: 100 900;
			font-stretch: 62% 125%;
		}

		* { margin: 0; padding: 0; box-sizing: border-box; }

		html, body {
			width: 1200px;
			height: 630px;
		}

		body {
			background: #E4E7E1;
			color: #151815;
			font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
			font-variant-numeric: tabular-nums;
			-webkit-font-smoothing: antialiased;
			padding: 56px 64px 48px;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
		}

		.top {
			display: flex;
			align-items: center;
			justify-content: space-between;
			font-size: 15px;
			letter-spacing: 0.02em;
			color: #59615A;
		}

		.mark {
			display: flex;
			align-items: center;
			gap: 10px;
			color: #151815;
		}

		.mark svg { width: 24px; height: 24px; }

		.body {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 360px;
			gap: 56px;
			align-items: start;
		}

		h1 {
			font-size: 112px;
			line-height: 0.9;
			letter-spacing: -0.04em;
			font-weight: 700;
			font-stretch: 105%;
		}

		.role {
			margin-top: 26px;
			font-size: 27px;
			line-height: 1.3;
			letter-spacing: -0.01em;
		}

		.state {
			margin-top: 18px;
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 18px;
			color: #59615A;
		}

		.dot {
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: #17544A;
			flex: none;
		}

		.measure {
			margin-top: 44px;
			max-width: 520px;
		}

		.measure-note {
			font-size: 15px;
			color: #59615A;
			margin-bottom: 10px;
		}

		.measure-line {
			position: relative;
			height: 1px;
			background: #151815;
		}

		.measure-line::before,
		.measure-line::after {
			content: "";
			position: absolute;
			top: -6px;
			width: 1px;
			height: 13px;
			background: #151815;
		}

		.measure-line::before { left: 0; }
		.measure-line::after { right: 0; }

		.measure-ends {
			display: flex;
			justify-content: space-between;
			margin-top: 9px;
			font-size: 14px;
			color: #59615A;
		}

		.portrait {
			width: 360px;
			height: 450px;
			overflow: hidden;
			border: 1px solid #151815;
			background: #D2D7CF;
		}

		.portrait img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			filter: grayscale(1);
		}

		.foot {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			border-top: 1px solid #8C948C;
			padding-top: 12px;
			font-size: 15px;
			color: #59615A;
		}

		.foot strong { color: #151815; font-weight: 600; }
	</style>
</head>

<body>
	<div class="top">
		<span class="mark">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
				stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="m18 16 4-4-4-4" />
				<path d="m6 8-4 4 4 4" />
				<path d="m14.5 4-5 16" />
			</svg>
			<strong>smartinezdev</strong>
		</span>
		<span>Mallorca · España</span>
	</div>

	<div class="body">
		<div>
			<h1>Santiago<br />Martínez</h1>
			<p class="role">Desarrollador full-stack · Diseño de interfaces</p>
			<p class="state"><span class="dot"></span>Disponible para entrevistas y proyectos</p>

			<div class="measure">
				<p class="measure-note">5 años · 7 proyectos · 4 equipos</p>
				<div class="measure-line"></div>
				<div class="measure-ends"><span>2021</span><span>2026</span></div>
			</div>
		</div>

		<div class="portrait">
			<img src="../public/img/linkedinPic.webp" alt="" />
		</div>
	</div>

	<div class="foot">
		<span><strong>Preact · Vite · Tailwind CSS</strong> · sitio autohospedado</span>
		<span>smartinezdev.com</span>
	</div>
</body>

</html>
